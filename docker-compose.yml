version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lab_attendance_postgres
    restart: always
    environment:
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
      POSTGRES_DB: lab_attendance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d lab_attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: lab_attendance_web
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://lab_user:lab_password@db:5432/lab_attendance_db
      - FLASK_SECRET_KEY=prod-secret-key-smart-lab
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./registered_faces:/app/registered_faces

volumes:
  postgres_data:
